<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d1117; /* GitHub Dark Mode Background */
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            max-width: 500px;
            padding: 20px;
        }

        /* Animated 404 text */
        .error-code {
            font-size: 8rem;
            font-weight: 800;
            color: #58a6ff;
            line-height: 1;
            margin-bottom: 10px;
            animation: float 4s ease-in-out infinite;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 15px;
            color: #f0f6fc;
        }

        p {
            font-size: 1rem;
            color: #8b949e;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* Return button */
        .btn {
            display: inline-block;
            background-color: #21262d;
            color: #58a6ff;
            border: 1px solid #30363d;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 6px;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #30363d;
            border-color: #8b949e;
        }

        /* Floating animation keyframes */
        @keyframes float {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
            }
            50% {
                transform: translateY(-15px) rotate(3deg);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Floating 404 Text -->
        <div class="error-code">404</div>
        <h1>Lost in Space?</h1>
        <p>The page you are looking for doesn't exist, has been moved, or is hiding in another galaxy.</p>
        <!-- Replace href="/" with your repository home link if needed -->
        <a href="/" class="btn">Return Home</a>
    </div>

</body>
</html>
